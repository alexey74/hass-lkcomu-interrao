/(
  | hass
  | interface
  | images
)/
'''

[dependency-groups]
dev = [
    "fake-useragent==0.1.11",
    "inter-rao-energosbyt-python @ git+https://github.com/alexey74/inter-rao-energosbyt-python@main",
]
